name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
      # Критические уязвимости в prod-зависимостях ломают CI
      - run: npm audit --omit=dev --audit-level=critical
      # Линтер пока только показывает замечания (накоплено много старых), не блокирует
      - run: npm run lint
        continue-on-error: true
