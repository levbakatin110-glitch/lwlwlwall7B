<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f1ea" />
    <title>Мая · нет интернета</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1ea;
        --fg: #2c2420;
        --muted: #7a6e66;
        --card: #fffdf9;
        --line: #e8ddd3;
        --accent: #c4785a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card {
        width: 100%;
        max-width: 22rem;
        padding: 1.5rem 1.25rem;
        border-radius: 1.25rem;
        border: 1px solid var(--line);
        background: var(--card);
        text-align: center;
        box-shadow: 0 10px 30px rgba(44, 36, 32, 0.06);
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
      }
      p {
        margin: 0.6rem 0 0;
        font-size: 0.95rem;
        line-height: 1.45;
        color: var(--muted);
      }
      button {
        margin-top: 1.1rem;
        width: 100%;
        border: 0;
        border-radius: 0.9rem;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Нет интернета</h1>
      <p>Попробуйте позже.</p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
